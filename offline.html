<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>离线 - 百事通</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #1a1a2e;
            color: #e2e8f0;
            padding: 20px;
        }
        .offline-container {
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .offline-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: rgba(245, 158, 11, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .offline-icon svg {
            width: 40px;
            height: 40px;
            stroke: #f59e0b;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .offline-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #f8fafc;
        }
        .offline-desc {
            font-size: 15px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .offline-btn {
            display: inline-block;
            padding: 12px 32px;
            background: #f59e0b;
            color: #1a1a2e;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .offline-btn:hover { background: #d97706; }
        .offline-btn:active { transform: scale(0.97); }
        .offline-tip {
            margin-top: 20px;
            font-size: 13px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">
            <svg viewBox="0 0 24 24">
                <line x1="1" y1="1" x2="23" y2="23"/>
                <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
                <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
                <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
                <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
                <line x1="12" y1="20" x2="12.01" y2="20"/>
            </svg>
        </div>
        <h1 class="offline-title">当前处于离线模式</h1>
        <p class="offline-desc">
            无法连接到网络，请检查您的网络连接后重试。<br>
            已缓存的内容仍可正常访问。
        </p>
        <button class="offline-btn" onclick="window.location.reload()">重新连接</button>
        <p class="offline-tip">恢复网络后将自动重新加载</p>
    </div>
    <script>
        // 网络恢复时自动重载
        window.addEventListener('online', function() {
            window.location.reload();
        });
    </script>
</body>
</html>
